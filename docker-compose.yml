services:
  db:
    image: pgvector/pgvector:pg16
    container_name: leyova-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-leyova}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 必填}
      POSTGRES_DB: ${DB_NAME:-leyova}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-leyova} -d ${DB_NAME:-leyova}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: leyova-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8788
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${DB_USER:-leyova}:${DB_PASSWORD:?DB_PASSWORD 必填}@db:5432/${DB_NAME:-leyova}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET 生产必填}
      API_ENCRYPTION_KEY: ${API_ENCRYPTION_KEY:?API_ENCRYPTION_KEY 生产必填}
      LEYOVA_MCP_TOKEN: ${LEYOVA_MCP_TOKEN:?LEYOVA_MCP_TOKEN 生产必填}
      LEYOVA_MCP_SIGNING_SECRET: ${LEYOVA_MCP_SIGNING_SECRET:?LEYOVA_MCP_SIGNING_SECRET 生产必填}
      LEYOVA_MCP_REQUIRE_SIG: ${LEYOVA_MCP_REQUIRE_SIG:-true}
      LEYOVA_SETUP_TOKEN: ${LEYOVA_SETUP_TOKEN:-}
      FEATURE_SCOPE: ${FEATURE_SCOPE:-core}
      EMBEDDED_JOBS: "true"
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5513}
      AI_ENABLED: ${AI_ENABLED:-false}
    ports:
      - "${API_PORT:-8788}:8788"
    volumes:
      - uploads:/app/apps/api/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8788/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    command: >
      sh -c "node database/migrate.js && node apps/api/dist/index.js"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: leyova-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-5513}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  pgdata:
  uploads:
